<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Дневник развития, медицинская карта и календарь прививок ребёнка">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Здоровье ребёнка">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Календарь развития и здоровья ребёнка</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Evict whatever the last visit left behind, then start the app.

    This page is served no-cache, so it is the only file guaranteed to be
    current — which makes it the only place that can clear the rest. Three
    deploys in a row reached the bucket and never reached a phone: hosting
    had once been told to treat every .js file as immutable for a year, and
    Flutter does not put a hash in main.dart.js, so browsers held a bundle
    from months earlier and had no reason to ask for another. Safari also
    kept a whole app shell in the service worker's cache storage.

    Everything below runs once, costs one round trip, and then never does
    anything again on a browser that has nothing stale to throw away. The
    app starts either way: every failure path falls through to start().
  -->
  <script>
    (function () {
      var started = false;
      function start() {
        if (started) return;
        started = true;
        var s = document.createElement('script');
        // Queried so this file itself can never be the stale one.
        s.src = 'flutter_bootstrap.js?v=' + Date.now();
        s.async = true;
        document.body.appendChild(s);
      }

      // Older browsers, or anything that does not do promises the way this
      // expects: start immediately rather than not at all.
      if (!window.Promise || !window.fetch) return start();

      var work = [];

      // The service worker is not registered any more (built with
      // --pwa-strategy=none), but one installed by an earlier version is
      // still in charge until it is told otherwise.
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        work.push(
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          })
        );
      }
      if (window.caches && caches.keys) {
        work.push(
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          })
        );
      }

      Promise.all(work)
        // One forced revalidation, which replaces the immutable entry with
        // the no-cache one hosting sends today. After this the browser asks
        // about the bundle on every visit, the way it always should have.
        .then(function () {
          return fetch('main.dart.js', { cache: 'reload' });
        })
        .catch(function () {})
        .then(start, start);
    })();
  </script>
</body>
</html>
