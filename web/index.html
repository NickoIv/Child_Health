<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Дневник развития, медицинская карта и календарь прививок ребёнка">
  <meta name="author" content="Ивашикин Николай">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Здоровье ребёнка">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- The warm page, not Flutter's template blue: this is the colour the
       browser paints its own chrome and the launch splash with. -->
  <meta name="theme-color" content="#FAF7F4">
  <title>Календарь развития и здоровья ребёнка</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Something on the screen while the application arrives.

    Flutter paints nothing at all until its first frame, and on a phone that
    is several seconds of a blank page — during which the honest reading is
    that the app is broken rather than loading. This costs no request: it is
    three rules and a dot that breathes, inline, and it is taken off the
    screen by `flutter-first-frame` below.

    The colours are the app's own light background, so the page does not
    flash a different one on the way in.
  -->
  <style>
    /* The app's own light page, and not the system's preference: this app
       chooses its theme itself and defaults to light, so painting the boot
       screen dark because the phone is dark would flash the wrong colour at
       everyone who never changed the setting. */
    html, body { margin: 0; height: 100%; background: #FAF7F4; }
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .25s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot i {
      width: 44px; height: 44px; border-radius: 50%;
      background: #A8570B; opacity: .18;
      animation: breathe 1.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(.75); opacity: .16; }
      50%      { transform: scale(1);   opacity: .34; }
    }
    /* The line the service worker asks for when a newer build is cached and
       the page is running the previous one. Never shown by itself. */
    #fresh {
      position: fixed; left: 12px; right: 12px; bottom: 12px;
      display: none; gap: 12px; align-items: center;
      padding: 12px 14px; border-radius: 16px;
      background: #221C18; color: #F6EFE9;
      font: 500 14px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      box-shadow: 0 12px 28px rgba(30, 26, 24, .28);
      z-index: 10;
    }
    #fresh button {
      margin-left: auto; flex: none;
      padding: 8px 14px; border: 0; border-radius: 10px;
      background: #E8A33D; color: #241A0B;
      font: 700 14px/1 inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="boot"><i></i></div>
  <div id="fresh">
    <span>Обновление готово</span>
    <button type="button" onclick="location.reload()">Обновить</button>
  </div>
  <!--
    Evict whatever the last visit left behind, then start the app.

    This page is served no-cache, so it is the only file guaranteed to be
    current — which makes it the only place that can clear the rest. Three
    deploys in a row reached the bucket and never reached a phone: hosting
    had once been told to treat every .js file as immutable for a year, and
    Flutter does not put a hash in main.dart.js, so browsers held a bundle
    from months earlier and had no reason to ask for another. Safari also
    kept a whole app shell in the service worker's cache storage.

    Everything below runs once, costs one round trip, and then never does
    anything again on a browser that has nothing stale to throw away. The
    app starts either way: every failure path falls through to start().
  -->
  <script>
    (function () {
      var started = false;
      function start() {
        if (started) return;
        started = true;
        var s = document.createElement('script');
        // Queried so this file itself can never be the stale one.
        s.src = 'flutter_bootstrap.js?v=' + Date.now();
        s.async = true;
        document.body.appendChild(s);
      }

      // Older browsers, or anything that does not do promises the way this
      // expects: start immediately rather than not at all.
      if (!window.Promise || !window.fetch) return start();

      var work = [];

      // Flutter's app-shell worker is not registered any more, but one
      // installed by an earlier version is still in charge until it is told
      // otherwise.
      //
      // Only that one. This used to unregister every service worker on the
      // origin, which took firebase-messaging-sw.js with it on every single
      // load — and that worker is the whole of background push: without it
      // registered, a reminder can only arrive while the tab is open, which
      // is exactly when nobody needs reminding. Push was built, shipped and
      // silently undone here.
      function isFlutterShell(registration) {
        var worker =
          registration.active || registration.waiting || registration.installing;
        return !!worker && worker.scriptURL.indexOf('flutter_service_worker.js') !== -1;
      }

      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        work.push(
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(
              regs.filter(isFlutterShell).map(function (r) { return r.unregister(); })
            );
          })
        );
      }
      // Flutter's caches, and only Flutter's. This used to clear every cache
      // on the origin, which was right while nothing else kept one — and is
      // wrong now that sw.js holds the shell that makes the app open with no
      // signal. Wiping it on every load would leave that worker with nothing
      // to serve, which is the same blank page by a longer route.
      if (window.caches && caches.keys) {
        work.push(
          caches.keys().then(function (keys) {
            return Promise.all(
              keys
                .filter(function (k) { return k.indexOf('flutter-') === 0; })
                .map(function (k) { return caches.delete(k); })
            );
          })
        );
      }

      // One forced revalidation of the bundle, replacing an immutable entry
      // from the year hosting was misconfigured with the no-cache one it
      // sends today — and once per browser, ever.
      //
      // It used to run on every single load, and it is a 1.3 MB download that
      // the whole application waited behind before it began to start. A fix
      // for a problem that existed for one week became four seconds of blank
      // page on every launch for months: «приложение долго открывается».
      var HEALED = 'bundle-revalidated-v1';
      if (window.localStorage && !localStorage.getItem(HEALED)) {
        work.push(
          fetch('main.dart.js', { cache: 'reload' })
            .then(function () {
              try { localStorage.setItem(HEALED, '1'); } catch (e) {}
            })
            .catch(function () {})
        );
      }

      Promise.all(work).catch(function () {}).then(start, start);

      // Our own worker, registered after the app is on its way rather than
      // before it: it exists for the second visit, and nothing about the
      // first one should wait on it. The shell inside it is network-first —
      // see web/sw.js — so it can never serve a stale page the way Flutter's
      // cache-first one did, and when it does have a newer bundle than the
      // one running it says so rather than swapping it underneath her.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'update-ready') {
            var bar = document.getElementById('fresh');
            if (bar) bar.style.display = 'flex';
          }
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }

      // The loading dot, off the screen the moment there is something behind
      // it. Flutter fires this on the window when it has painted once.
      window.addEventListener('flutter-first-frame', function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        boot.className = 'done';
        setTimeout(function () { boot.remove(); }, 300);
      });
    })();
  </script>
</body>
</html>
