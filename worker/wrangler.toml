name = "child-health-ai"
main = "worker.js"
compatibility_date = "2026-07-01"

# Hourly reminder sweep. Cron triggers are included in the Workers free plan,
# which is the whole reason the scheduler lives here rather than in Cloud
# Functions — those need the paid Blaze plan.
[triggers]
crons = ["0 * * * *"]

[vars]
# Alias rather than a pinned version: Google retires model names without
# notice. Check what a key may actually call with GET /models on the Worker.
GEMINI_MODEL = "gemini-flash-latest"

# Lock this to the hosting domain once deployed, so the free quota cannot be
# spent from someone else's page. "*" is fine only while testing locally.
ALLOWED_ORIGIN = "https://child-health-tracker-7aad1.web.app"

# Who family invitations are sent from. Must be an address verified in Brevo,
# which on the free tier is any single mailbox you own — no domain to buy.
MAIL_FROM = "nickru777@gmail.com"
MAIL_FROM_NAME = "Дневник ребёнка"

# None of the keys are set here — they are secrets:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
#   npx wrangler secret put FIREBASE_API_KEY
#   npx wrangler secret put BREVO_API_KEY
